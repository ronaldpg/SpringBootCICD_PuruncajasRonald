spring:
    datasource:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
        driver-class-name: org.h2.Driver
        username: sa
        password:

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
    #jackson:
        #serialization:
           # write-dates-as-timestamps: false

    sql:
        init:
            mode: never

    logging:
        level:
            root: warn

    devtools:
        restart:
            enabled: true
server:
    port: 8080

app:
    version: ${APP_VERSION:no-version}