name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Esto ayuda a que Git no se confunda con los submódulos antiguos
          submodules: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Esto acelera el build guardando las librerías de Gradle
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        # 'build' ya ejecuta los tests por defecto, así que no necesitas dos pasos
        run: ./gradlew clean build

      - name: Upload Build Artifact
        # Esto guarda tu archivo .jar por si quieres descargarlo después
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs/*.jar